<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<style>
  .logo { display: inline-block; background: var(--ink); color: var(--white); font-size: 58px; padding: 8px 14px 4px; transform: rotate(-3deg); margin-top: 26px; box-shadow: 5px 5px 0 var(--white); }
  .tagline { font-family: var(--display); font-size: 26px; color: var(--white); text-transform: uppercase; line-height: 1; margin-top: 18px; text-shadow: 2px 2px 0 var(--ink); }
  .loc { display: inline-flex; align-items: center; gap: 6px; background: var(--white); border: 2px solid var(--ink); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; margin-top: 16px; }
  .auth { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
  .auth .btn { justify-content: flex-start; padding-left: 18px; }
  .g { font-weight: 900; font-size: 18px; color: #4285F4; width: 18px; text-align: center; }
  .or { text-align: center; font-size: 11px; font-weight: 800; color: var(--white); margin: 14px 0 0; letter-spacing: 2px; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 262px; background: var(--paper); clip-path: polygon(0 18%, 100% 0, 100% 100%, 0 100%); }
  .ball { position: absolute; left: -30px; bottom: 54px; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #444, #111 60%); border: 3px solid var(--ink); }
  .ball i { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--paper); }
  .burst { position: absolute; left: 112px; bottom: 150px; width: 92px; height: 92px; background: var(--red-hot); clip-path: polygon(50% 0, 61% 30%, 95% 18%, 73% 46%, 100% 62%, 66% 66%, 72% 100%, 50% 76%, 25% 100%, 32% 66%, 0 62%, 27% 46%, 5% 18%, 39% 30%); }
  .slogan { position: absolute; right: 22px; bottom: 112px; font-family: var(--hand); font-size: 22px; line-height: 1.05; transform: rotate(-8deg); text-align: right; }
  .terms { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 11px; }
</style>
</head>
<body class="red">
<div class="screen">
  <div class="status" style="color:#fff"><span>9:41</span><span class="icons"><span class="sig"></span><span class="bat"></span></span></div>

  <svg class="scribble" style="right:26px;top:70px;stroke:#fff" width="64" height="44" viewBox="0 0 64 44"><path d="M4 38 L10 8 L22 26 L32 4 L42 26 L54 8 L60 38 Z"/></svg>

  <div class="content">
    <div class="display logo">BOWLVERSE</div>
    <div class="tagline">Persone vere.<br>Partite vere.<br>Adesso.</div>
    <div class="loc"><span class="dot"></span>Sei a: QubicaAMF Bologna</div>

    <div class="auth">
      <div class="btn"><span class="g">G</span>Continua con Google</div>
      <div class="btn black"><svg class="i" viewBox="0 0 24 24" style="fill:#fff;stroke:none"><path d="M16 3c0 2-1.6 3.6-3.4 3.5C12.4 4.6 14.1 3 16 3zM19.5 17c-.8 1.9-2 4-3.6 4-1.4 0-1.8-.9-3.4-.9s-2.1.9-3.4.9C7.3 21 4.5 16.7 4.5 12.8c0-3 2-4.8 3.9-4.8 1.4 0 2.4.9 3.5.9 1 0 2.3-1 3.9-.9 1.3 0 2.6.7 3.3 1.8-3 1.7-2.4 6 .4 7.2z"/></svg>Continua con Apple</div>
      <div class="btn"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 6l9 7 9-7"/></svg>Continua con Email</div>
    </div>
    <div class="or">&mdash;&mdash; O SCANSIONA IL QR DELLA PISTA &mdash;&mdash;</div>
  </div>

  <div class="bottom"></div>
  <div class="burst"></div>
  <div class="ball"><i style="left:58px;top:44px"></i><i style="left:86px;top:36px"></i><i style="left:80px;top:66px"></i></div>
  <div class="slogan">BUONE PARTITE,<br>PERSONE<br>MIGLIORI</div>
  <svg class="scribble" style="right:30px;bottom:72px" width="120" height="20" viewBox="0 0 120 20"><path d="M2 12 Q 15 2 28 12 T 54 12 T 80 12 T 106 12 L 118 8"/></svg>
  <div class="terms">Continuando accetti i <b><u>Termini di servizio</u></b> e la <b><u>Privacy</u></b>.</div>
</div>
</body>
</html>
