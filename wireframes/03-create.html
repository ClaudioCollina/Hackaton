<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<link rel="stylesheet" href="style.css">
<style>
  .top { display: flex; justify-content: space-between; align-items: center; padding: 2px 18px 0; }
  .top .ib { width: 34px; height: 34px; border-radius: 8px; background: var(--dark-2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
  .title { position: relative; margin-top: 10px; }
  .title .display { font-size: 42px; }
  .title .display em { font-style: normal; color: var(--red); }
  .title .sticker { right: 6px; top: 6px; font-size: 16px; background: var(--paper); color: var(--ink); transform: rotate(8deg); }

  .label { color: #bbb; }

  .modes { display: flex; gap: 10px; }
  .mode { flex: 1; border: 2px solid #000; border-radius: 10px; background: var(--paper); color: var(--ink); padding: 6px; text-align: center; position: relative; }
  .mode img { width: 40px; height: 32px; display: block; object-fit: contain; margin: 0 auto 2px; }
  .mode b { font-family: var(--display); font-weight: 400; font-size: 15px; text-transform: uppercase; display: block; }
  .mode small { font-size: 9px; color: #555; }
  .mode.on { background: var(--red); color: var(--white); box-shadow: 3px 3px 0 var(--paper); }
  .mode.on small { color: #ffd6d3; }
  .mode .chk { position: absolute; top: -9px; right: -9px; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); color: var(--ink); border: 2px solid #000; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; }

  .opt { background: var(--dark-2); color: #ddd; border: 1px solid var(--line); }
  .opt.on { background: var(--red); color: var(--white); border: 2px solid #000; box-shadow: 2px 2px 0 var(--paper); }

  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--dark-2); }
  .stepper button { appearance: none; border: 0; padding: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .stepper span, .stepper button { width: 38px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; }
  .stepper .v { font-family: var(--display); font-size: 24px; background: var(--paper); color: var(--ink); width: 46px; }
  .player-control { width: 160px; }
  .player-control .stepper { width: 100%; justify-content: space-between; }

  .note { border: 1px solid var(--line); border-radius: 8px; background: var(--dark-2); padding: 8px 12px 20px; font-size: 13px; height: 72px; position: relative; }
  .note textarea { display: block; width: 100%; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; color: #ddd; font: inherit; resize: none; }
  .note textarea::placeholder { color: #888; opacity: 1; }
  .note small { position: absolute; right: 10px; bottom: 6px; font-size: 10px; }

  .summary { display: flex; padding: 9px 10px; margin: 14px 0 16px; }
  .summary > div { flex: 1; text-align: center; }
  .summary > div + div { border-left: 1px solid #ccc; }
  .summary .n { font-family: var(--display); font-size: 17px; }
  .summary .t { font-size: 10px; color: #555; }

  .btn.big { background: var(--red); color: var(--white); border-color: #000; box-shadow: 5px 5px 0 var(--paper); }
</style>
</head>
<body class="dark">
<div class="screen">
  <div class="status"><span>9:41</span><span class="icons"><span class="sig"></span><span class="bat"></span></span></div>
  <div class="top"><div class="ib" onclick="location.href='02-community.html'">&larr;</div><div class="ib" onclick="location.href='02-community.html'">&times;</div></div>

  <div class="content">
    <div class="title">
      <div class="display">Create a<br><em>new game</em></div>
      <div class="sticker">1 tap<br>to play!</div>
      <svg class="scribble" style="left:0;top:86px" width="250" height="12" viewBox="0 0 250 12"><path d="M2 8 Q 40 2 80 7 T 160 6 T 248 5"/></svg>
      <svg class="scribble" style="right:-4px;top:58px;stroke:var(--paper)" width="40" height="30" viewBox="0 0 40 30"><path d="M4 26 C 10 10, 22 4, 36 4 M28 0 L36 4 L30 11"/></svg>
    </div>

    <div class="label" style="margin-top:20px">Game type</div>
    <div class="modes">
      <div class="mode on"><span class="chk">&#10003;</span><img src="assets/game-pins.png" alt="Bowling pins"><b>Bowling</b></div>
      <div class="mode"><img src="assets/game-eight-ball.png" alt="Pool eight ball"><b>Pool</b></div>
      <div class="mode"><img src="assets/game-dominoes.png" alt="Cornhole board and bags"><b>Cornhole</b></div>
    </div>

    <div class="player-control">
      <div class="label">Players</div>
      <div class="stepper">
        <button type="button" id="players-minus" aria-label="Remove a player">&minus;</button>
        <span class="v" id="players-value" aria-live="polite">2</span>
        <button type="button" id="players-plus" aria-label="Add a player">+</button>
      </div>
    </div>
    <script>
      (function () {
        var MIN = 2, MAX = 6, count = 2;
        var value = document.getElementById('players-value');
        var minus = document.getElementById('players-minus');
        var plus = document.getElementById('players-plus');
        function render() {
          value.textContent = count;
          minus.disabled = count <= MIN;
          plus.disabled = count >= MAX;
        }
        minus.addEventListener('click', function () { if (count > MIN) { count--; render(); } });
        plus.addEventListener('click', function () { if (count < MAX) { count++; render(); } });
        render();
      })();
    </script>

    <div class="label">Skill level</div>
    <div class="opts"><div class="opt">Any</div><div class="opt">Beginner</div><div class="opt on">Intermediate</div><div class="opt">Advanced</div></div>

    <div class="label">When</div>
    <div class="opts"><div class="opt on">Now</div><div class="opt">In 15 min</div><div class="opt">Choose a time &#9662;</div></div>

    <div class="label">Notes (optional)</div>
    <div class="note">
      <textarea maxlength="100" placeholder="Looking for someone to practice with..." aria-label="Optional game notes" oninput="document.getElementById('note-count').textContent = this.value.length + '/100'"></textarea>
      <small id="note-count">0/100</small>
    </div>

    <div class="card summary">
      <div><div class="n"><span class="dot green"></span> Lane 7</div><div class="t">available</div></div>
      <div><div class="n">&euro;6.50</div><div class="t">per person</div></div>
      <div><div class="n">20 min</div><div class="t">max wait</div></div>
    </div>

    <div class="btn big" onclick="location.href='05-notification.html'">Create game &rarr;</div>
  </div>
</div>
</body>
</html>
