<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E30613">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
<style>
  .content { overflow: visible; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }

  .logo { display: inline-block; background: var(--ink); color: var(--white); font-size: clamp(44px, 15.5vw, 66px); padding: 8px 14px 4px; transform: rotate(-3deg); margin-top: clamp(14px, 3.5dvh, 34px); box-shadow: 5px 5px 0 var(--white); }
  .tagline { font-family: var(--display); font-size: clamp(22px, 7vw, 30px); color: var(--white); text-transform: uppercase; line-height: 1; margin-top: clamp(12px, 2.4dvh, 22px); text-shadow: 2px 2px 0 var(--ink); }
  .loc { display: inline-flex; align-items: center; gap: 6px; background: var(--white); border: 2px solid var(--ink); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; margin-top: clamp(10px, 2dvh, 18px); }
  .auth { display: flex; flex-direction: column; gap: 12px; margin-top: clamp(14px, 3dvh, 26px); position: relative; z-index: 2; }
  .auth .btn { justify-content: flex-start; padding: 14px 18px; font-size: 15px; }
  .g { font-weight: 900; font-size: 18px; color: #4285F4; width: 18px; text-align: center; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; height: clamp(190px, 30dvh, 280px); background: var(--paper); clip-path: polygon(0 18%, 100% 0, 100% 100%, 0 100%); }
  .ball { position: absolute; left: -8vw; bottom: calc(50px + env(safe-area-inset-bottom)); width: clamp(140px, 48vw, 210px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #444, #111 60%); border: 3px solid var(--ink); }
  .ball i { position: absolute; width: 9.5%; aspect-ratio: 1; border-radius: 50%; background: var(--paper); }
  .burst { position: absolute; left: 29vw; bottom: calc(clamp(140px, 48vw, 210px) + 10px + env(safe-area-inset-bottom)); width: clamp(70px, 24vw, 100px); aspect-ratio: 1; background: var(--red); clip-path: polygon(50% 0, 61% 30%, 95% 18%, 73% 46%, 100% 62%, 66% 66%, 72% 100%, 50% 76%, 25% 100%, 32% 66%, 0 62%, 27% 46%, 5% 18%, 39% 30%); }
  .slogan { position: absolute; right: 22px; bottom: calc(112px + env(safe-area-inset-bottom)); font-family: var(--hand); font-size: clamp(18px, 5.8vw, 24px); line-height: 1.05; transform: rotate(-8deg); text-align: right; }
  .wave { right: 30px; bottom: calc(72px + env(safe-area-inset-bottom)); }
  .register { position: absolute; left: 0; right: 0; bottom: calc(42px + env(safe-area-inset-bottom)); color: var(--ink); text-align: center; font-size: 13px; }
  .register b { color: var(--red); text-decoration: underline; }
  .terms { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); text-align: center; font-size: 11px; padding: 0 20px; }

  /* Short screens (e.g. iPhone SE) */
  @media (max-height: 700px) {
    .tagline br:last-of-type { display: none; }
    .ball, .burst { display: none; }
    .slogan { bottom: calc(60px + env(safe-area-inset-bottom)); }
    .wave { display: none; }
  }
</style>
</head>
<body class="red">
<div class="screen">
  <div class="status" style="color:#fff"><span>9:41</span><span class="icons"><span class="sig"></span><span class="bat"></span></span></div>

  <img src="assets/qubica-logo.png" alt="Qubica" style="position:absolute;right:26px;top:70px;width:64px;height:auto">

  <div class="content">
    <div class="display logo">StrikeMate</div>
    <div class="tagline">Real people.<br>Real games.<br>Now.</div>
    <div class="auth">
      <div class="btn" onclick="location.href='02-community.html'"><span class="g">G</span>Continue with Google</div>
      <div class="btn black" onclick="location.href='02-community.html'"><svg class="i" viewBox="0 0 24 24" style="fill:#fff;stroke:none"><path d="M16 3c0 2-1.6 3.6-3.4 3.5C12.4 4.6 14.1 3 16 3zM19.5 17c-.8 1.9-2 4-3.6 4-1.4 0-1.8-.9-3.4-.9s-2.1.9-3.4.9C7.3 21 4.5 16.7 4.5 12.8c0-3 2-4.8 3.9-4.8 1.4 0 2.4.9 3.5.9 1 0 2.3-1 3.9-.9 1.3 0 2.6.7 3.3 1.8-3 1.7-2.4 6 .4 7.2z"/></svg>Continue with Apple</div>
      <div class="btn" onclick="location.href='02-community.html'"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 6l9 7 9-7"/></svg>Continue with Email</div>
    </div>
  </div>

  <div class="bottom"></div>
  <div class="burst"></div>
  <div class="ball"><i style="left:30%;top:23%"></i><i style="left:45%;top:19%"></i><i style="left:42%;top:35%"></i></div>
  <div class="slogan">GREAT GAMES,<br>BETTER<br>PEOPLE</div>
  <svg class="scribble wave" width="120" height="20" viewBox="0 0 120 20"><path d="M2 12 Q 15 2 28 12 T 54 12 T 80 12 T 106 12 L 118 8"/></svg>
  <div class="register">New to StrikeMate? <b>Sign up</b></div>
  <div class="terms">By continuing, you agree to the <b><u>Terms of Service</u></b> and <b><u>Privacy Policy</u></b>.</div>
</div>
</body>
</html>
