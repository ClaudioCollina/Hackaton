<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<link rel="stylesheet" href="style.css">
<style>
  .sheet { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; overflow-y: auto; background: #555; color: var(--white); border-top: 3px solid #000; border-radius: 22px 22px 0 0; padding: 12px 18px calc(24px + env(safe-area-inset-bottom)); }
  .sheet .sticker { left: 18px; top: 26px; font-size: 22px; }
  .headline { font-size: 38px; margin-top: 50px; position: relative; }
  .headline em { font-style: normal; color: var(--red); }

  .game-type { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 26px; }
  .game-type img { width: 76px; height: 70px; object-fit: cover; border: 2px solid var(--ink); border-radius: 10px; }
  .game-type b { font-family: var(--display); font-size: 28px; font-weight: 400; text-transform: uppercase; }

  .who { display: flex; margin-top: 14px; padding: 8px 6px; background: var(--white); }
  .who > div { flex: 1; text-align: center; }
  .who > div + div { border-left: 1px solid #ccc; }
  .who .n { font-family: var(--display); font-size: 19px; }
  .who .t { font-size: 10px; color: #555; }

  .booking { background: var(--ink); color: var(--white); border-radius: 10px; border: 2px solid #000; padding: 10px 12px; margin-top: 12px; display: flex; align-items: center; gap: 12px; }
  .booking .lane { background: var(--red); border: 2px solid var(--white); border-radius: 8px; padding: 4px 10px; text-align: center; }
  .booking .lane .n { font-family: var(--display); font-size: 30px; line-height: 1; }
  .booking .lane .t { font-size: 9px; font-weight: 800; text-transform: uppercase; }
  .booking .d { font-size: 12px; line-height: 1.5; }

  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
</style>
</head>
<body class="dark">
<div class="screen">
  <div class="status"><span>9:41</span><span class="icons"><span class="sig"></span><span class="bat"></span></span></div>

  <div class="sheet">
    <div class="sticker">Match!</div>

    <div class="display headline">John has<br><em>joined the game</em></div>

    <div class="game-type">
      <img src="assets/game-pins.png" alt="Bowling pins">
      <b>Bowling</b>
    </div>

    <div class="card who">
      <div><div class="n">Intermediate</div><div class="t">skill level</div></div>
      <div><div class="n">&#9733; 4.6</div><div class="t">18 reviews</div></div>
      <div><div class="n">1,190</div><div class="t">ranking</div></div>
    </div>

    <div class="booking">
      <div class="lane"><div class="n">7</div><div class="t">Lane</div></div>
      <div class="d"><b>Today, 6:05 PM</b> &middot; 1 game<br>Friendly &middot; &euro;6.50 per person<br></div>
    </div>

    <div class="actions">
      <div class="btn"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Message John</div>
    </div>
  </div>
</div>
</body>
</html>
